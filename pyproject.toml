[project]
name = "cgv-push-bot"
version = "0.1.0"
description = "Discord alerts for newly scheduled CGV movies"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.18,<2",
    "discord.py>=2.7,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
